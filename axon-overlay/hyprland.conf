# Exemple seulement : remplace /CHEMIN/DU/PROJET par la racine de ton Axon.
# Ce fichier n’est jamais appliqué automatiquement par installer.py.
$axonOverlay = /CHEMIN/DU/PROJET/.axon/plugins/axon-overlay
exec-once = sh $axonOverlay/lancer.sh
bind = SUPER, A, exec, sh $axonOverlay/waybar-toggle.sh

# Règles reprises de la configuration fournie (syntaxe match:).
layerrule = blur true,match:namespace axon-overlay
layerrule = ignore_alpha 0,match:namespace axon-overlay
