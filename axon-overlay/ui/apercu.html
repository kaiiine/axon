<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axon — aperçu Svelte</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1015;color:#e4e6eb;font:13px system-ui}main{max-width:920px;padding:36px 20px;margin:auto}h1{font-size:23px;font-weight:500;letter-spacing:-.6px}p{color:#8a909e;line-height:1.7}.desktop{padding:0 15px 70px;margin-top:26px;min-height:350px;border-radius:16px;background:radial-gradient(ellipse at bottom left,#363851,transparent 80%),#181b24;border:1px solid #ffffff08;overflow:hidden}.stage{width:100%;position:relative;height:184px;transition:height .2s}iframe{width:680px;height:184px;position:absolute;left:50%;top:0;border:0;transform-origin:top center;transition:height .2s;border-radius:0 0 22px 22px}small{display:block;color:#737b89;margin-top:16px;font-size:10px}code{color:#d6b56e}</style></head><body><main><h1>Axon, sans interruption.</h1><p>La même interface Svelte que dans l’overlay. Clique sur la carte pour ouvrir le diff, ou sur la bulle pour discuter.</p><div class="desktop"><div class="stage" id="stage"><iframe id="frame" src="index.html?demo=1" title="Axon — interface de démonstration"></iframe></div></div><small>Mode démonstration · aucun agent ni service externe connecté.</small></main><script>const frame=document.getElementById('frame'),stage=document.getElementById('stage');let height=184;function size(){const scale=Math.min(1,stage.clientWidth/680);frame.style.transform='translateX(-50%) scale('+scale+')';frame.style.height=height+'px';stage.style.height=height*scale+'px';}window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.source==='axon-overlay-preview'&&[184,420].includes(event.data.height)){height=event.data.height;size();}});window.addEventListener('resize',size);size();</script></body></html>
