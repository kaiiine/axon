<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc"><title id="title">Axon — réflexion</title><desc id="desc">Axon, petit axolotl orange de face. Yeux symétriques, bouche centrée, grande tête et petit corps.</desc><defs>
<linearGradient id="skin" x1="25%" y1="0%" x2="75%" y2="100%"><stop stop-color="#FFDB83"/><stop offset=".38" stop-color="#FFBF2B"/><stop offset=".76" stop-color="#FFAF00"/><stop offset="1" stop-color="#ED9900"/></linearGradient>
<linearGradient id="body-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E99A00"/><stop offset="1" stop-color="#FFBC29"/></linearGradient>
<linearGradient id="gill-fill" x1="0%" y1="0%" x2="75%" y2="100%"><stop stop-color="#FFC046"/><stop offset="1" stop-color="#EA8D13"/></linearGradient>
<radialGradient id="gleam" cx="35%" cy="12%" r="72%"><stop stop-color="#FFF4D6" stop-opacity=".35"/><stop offset=".75" stop-color="#FFF4D6" stop-opacity="0"/></radialGradient>
</defs><style>
.breathe {transform-origin:256px 350px;animation:breathe 4s ease-in-out infinite}
.blink {transform-box:fill-box;transform-origin:center;animation:blink 5s linear infinite}
.thinking .head-group {transform-origin:256px 282px;animation:ponder 4s ease-in-out infinite}
.finished .breathe {animation:celebrate 2s ease-in-out infinite}
.sleeping .breathe {animation:sleep 4s ease-in-out infinite}
.bubble {animation:bubble 2s ease-in-out infinite}
.bubble.second {animation-delay:.2s}.bubble.third {animation-delay:.4s}
.spark {transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite}
.cursor {animation:cursor 1s steps(1) infinite}
.working .hand-left {transform-origin:176px 336px;animation:typeL .6s ease-in-out infinite}
.working .hand-right {transform-origin:336px 336px;animation:typeL .6s ease-in-out .3s infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,43%,49%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
@keyframes ponder{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes celebrate{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}55%{transform:translateY(0)}}
@keyframes sleep{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.99)}}
@keyframes bubble{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes typeL{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media(prefers-reduced-motion:reduce){.breathe,.blink,.head-group,.bubble,.spark,.cursor,.hand-left,.hand-right{animation:none!important}}
</style><g id="axon" class="thinking"><g class="breathe" transform="translate(0 0.000)"><g id="feet" fill="url(#skin)"><ellipse cx="224" cy="390" rx="24" ry="12"/><ellipse cx="288" cy="390" rx="24" ry="12"/></g><path d="M 215 310 C 193 325 194 362 201 381 C 209 401 303 401 311 381 C 318 362 319 325 297 310 Z" fill="url(#body-fill)" id="body"/><ellipse id="belly" cx="256" cy="356" rx="30" ry="23" fill="#FFE0A0" opacity=".48"/><g class="head-group" transform="rotate(0.000 256 282)"><g id="gills-left"><path d="M 143 214 C 114 213 88 188 90 170 C 92 157 105 159 114 170 C 130 190 143 190 150 199 Z" fill="url(#gill-fill)" /><path d="M 139 237 C 110 242 72 232 67 216 C 63 203 75 198 87 206 C 107 217 126 213 143 219 Z" fill="url(#gill-fill)" /><path d="M 144 252 C 129 276 104 289 88 280 C 77 274 84 260 96 257 C 111 253 122 243 140 238 Z" fill="url(#gill-fill)" /><path d="M 113 193 Q 110 178 115 169 M 95 222 Q 82 230 74 226 M 113 266 Q 111 281 100 287" fill="none" stroke="url(#gill-fill)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></g><g id="gills-right" transform="translate(512 0) scale(-1 1)"><path d="M 143 214 C 114 213 88 188 90 170 C 92 157 105 159 114 170 C 130 190 143 190 150 199 Z" fill="url(#gill-fill)" /><path d="M 139 237 C 110 242 72 232 67 216 C 63 203 75 198 87 206 C 107 217 126 213 143 219 Z" fill="url(#gill-fill)" /><path d="M 144 252 C 129 276 104 289 88 280 C 77 274 84 260 96 257 C 111 253 122 243 140 238 Z" fill="url(#gill-fill)" /><path d="M 113 193 Q 110 178 115 169 M 95 222 Q 82 230 74 226 M 113 266 Q 111 281 100 287" fill="none" stroke="url(#gill-fill)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M 256 148 C 174 148 129 168 128 231 C 127 296 161 328 256 328 C 351 328 385 296 384 231 C 383 168 338 148 256 148 Z" fill="url(#skin)" id="head"/><path d="M 256 148 C 174 148 129 168 128 231 C 127 296 161 328 256 328 C 351 328 385 296 384 231 C 383 168 338 148 256 148 Z" fill="url(#gleam)" id="head-light"/><g id="cheeks" fill="#E78120" opacity=".28"><ellipse cx="177" cy="261" rx="15" ry="8"/><ellipse cx="335" cy="261" rx="15" ry="8"/></g><g id="eyes" transform="translate(0 -5)" fill="#362314"><g transform="translate(205 232)"><g class="blink"><ellipse cx="0" cy="0" rx="8" ry="12.00"/></g></g><g transform="translate(307 232)"><g class="blink"><ellipse cx="0" cy="0" rx="8" ry="12.00"/></g></g><path d="M 195 206 Q 205 202 215 206 M 297 206 Q 307 202 317 206" fill="none" stroke="#362314" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M 247 269 Q 256 267 265 269" fill="none" stroke="#362314" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" id="mouth"/></g><g id="hands"><ellipse cx="171" cy="345" rx="14" ry="19" transform="rotate(-18 171 345)" fill="url(#skin)"/><path d="M 303 333 C 318 325 314 301 301 300 C 290 299 281 313 286 324 C 289 332 297 336 303 333 Z" fill="url(#skin)" /></g><g id="thoughts"><circle class="bubble first" cx="362" cy="132" r="4" fill="#FFCA62" opacity="1.00"/><circle class="bubble second" cx="379" cy="114" r="6" fill="#FFCA62" opacity="1.00"/><circle class="bubble third" cx="398" cy="94" r="9" fill="#FFCA62" opacity="1.00"/></g></g></g></svg>